<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #8B0000;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .button-container {
            display: flex;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <div class="button-container">
        <!-- Home Button -->
        <a href="index.html" class="btn">Home</a>

        <!-- Button 1 (Replace 'page1.html' and 'Button One' with your name/link) -->
        <a href="CS.html" class="btn">Computer Science</a>

        <!-- Button 2 (Replace 'page2.html' and 'Button Two' with your name/link) -->
        <a href="Geog.html" class="btn">Geography</a>
    </div>

</body>
</html>
